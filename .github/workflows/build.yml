name: Build SerialPortConnector (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtserialport'
        tools: 'tools_mingw1120'
        cache: true

    - name: Build
      shell: cmd
      run: |
        set PATH=%IQTA_TOOLS%\mingw1120_64\bin;%PATH%
        mkdir build
        cd build
        qmake ..\SerialPortConnector.pro CONFIG+=release
        mingw32-make -j4

    - name: Deploy
      shell: cmd
      run: |
        mkdir deploy
        copy build\release\SerialPortConnector.exe deploy\
        set PATH=%IQTA_TOOLS%\mingw1120_64\bin;%PATH%
        windeployqt --release deploy\SerialPortConnector.exe

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: SerialPortConnector-Windows
        path: deploy/
