name: Build SerialPortConnector (Windows Only)

on:
  push:
    branches: [ fpenuin-patch-1 ]
  pull_request:
    branches: [ fpenuin-patch-1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        cache: true
    
    - uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build
      shell: cmd
      run: |
        mkdir build
        cd build
        qmake ..\SerialPortConnector.pro CONFIG+=release
        nmake

    - name: Deploy
      shell: cmd
      run: |
        mkdir deploy
        copy build\release\SerialPortConnector.exe deploy\
        windeployqt --release deploy\SerialPortConnector.exe

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: SerialPortConnector-Windows
        path: deploy/
