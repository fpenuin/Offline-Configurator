name: Build SerialPortConnector (Windows Only)

on:
  push:
    branches: [ fpenuin-patch-1 ]
  pull_request:
    branches: [ fpenuin-patch-1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # 1. Setup MSYS2 + toolchain
    # =========================
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        path-type: inherit  # 强制继承并扩展 Windows PATH
        install: >
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-serialport
          mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          zip
    # =========================
    # 2. Build
    # =========================
    - name: Build
      shell: msys2 {0}
      run: |
        # 1. 导出路径（保持不变）
        export PATH="/mingw64/bin:/usr/bin:$PATH"
        
        # 2. 检查版本（改用 qmake-qt5）
        qmake-qt5 -v
    
        mkdir -p build
        cd build
        
        # 3. 使用 qmake-qt5 生成 Makefile
        qmake-qt5 ../SerialPortConnector.pro CONFIG+=release
        
        # 4. 编译
        mingw32-make -j$(nproc)

    # =========================
    # 3. Deploy (关键)
    # =========================
    - name: Deploy Qt runtime
      run: |
        set -e
        mkdir -p deploy
        
        # 1. 寻找生成的 exe
        EXE=$(find build -name "*.exe" | grep -i "release" | head -n 1)
        [ -z "$EXE" ] && EXE=$(find build -name "*.exe" | head -n 1)
        
        echo "Found exe: $EXE"
        cp "$EXE" deploy/

        # 2. 核心：全系统搜索 windeployqt
        # 搜索所有包含 windeploy 关键字的可执行文件
        WINDEPLOY=$(find /mingw64/ -name "windeployqt*" -type f | head -n 1)
        
        if [ -z "$WINDEPLOY" ]; then
          echo "ERROR: windeployqt not found in /mingw64/"
          ls -R /mingw64/bin | grep deploy
          exit 1
        fi

        echo "Using deploy tool: $WINDEPLOY"

        # 3. 执行部署
        # 注入 PATH 是为了让 windeployqt 能找到它依赖的 DLL
        export PATH="/mingw64/bin:$PATH"
        "$WINDEPLOY" --release --compiler-runtime --verbose 1 deploy/*.exe

    # =========================
    # 4. Package
    # =========================
    - name: Package
      run: |
        set -e
        cd deploy
        zip -r ../SerialPortConnector-Windows.zip .

    # =========================
    # 5. Upload artifact
    # =========================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SerialPortConnector-Windows
        path: SerialPortConnector-Windows.zip

    # =========================
    # 6. Create GitHub Release
    # =========================
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: SerialPortConnector-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
