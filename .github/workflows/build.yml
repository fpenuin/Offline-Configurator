name: Build SerialPortConnector (Windows Only)

on:
  push:
    branches: [ fpenuin-patch-1 ]
  pull_request:
    branches: [ fpenuin-patch-1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        # update: true
        install: >
          # mingw-w64-x86_64-gcc
          # mingw-w64-x86_64-qt5-base
          # mingw-w64-x86_64-qt5-serialport
          # mingw-w64-x86_64-qt5-tools
          # mingw-w64-x86_64-make
          # mingw-w64-x86_64-cmake
          # mingw-w64-x86_64-angleproject
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-qt5
          mingw-w64-x86_64-make
        cache: true

    - name: Build
      run: |
        export PATH="/mingw64/bin:/usr/bin:$PATH"
        mkdir -p build
        cd build
        qmake-qt5 ../SerialPortConnector.pro CONFIG+=release
        mingw32-make -j$(nproc)

    - name: Deploy
      run: |
        mkdir -p deploy
        cp build/release/SerialPortConnector.exe deploy/
        export PATH="/mingw64/bin:$PATH"
        windeployqt-qt5.exe \
          --release \
          --compiler-runtime \
          --no-opengl \
          --no-opengl-sw \
          --no-translations \
          deploy/*.exe

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: SerialPortConnector-Windows
        path: deploy/
