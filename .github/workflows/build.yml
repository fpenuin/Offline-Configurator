name: Build SerialPortConnector (Windows Only)

on:
  push:
    branches: [ fpenuin-patch-1 ]
  pull_request:
    branches: [ fpenuin-patch-1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # 1. Setup MSYS2 + toolchain
    # =========================
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        path-type: inherit  # 强制继承并扩展 Windows PATH
        install: >
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-qt5-base
          mingw-w64-x86_64-qt5-serialport
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          zip
    # =========================
    # 2. Build
    # =========================
    - name: Build
      shell: msys2 {0}
      run: |
        # 1. 强力注入 MinGW64 二进制路径
        # 在 MSYS2 中，/mingw64 映射到物理路径，但在 shell 中必须在 PATH 前端
        export PATH="/mingw64/bin:/usr/bin:$PATH"
        
        # 2. 诊断：打印当前 PATH 和 qmake 的实际位置
        echo "Current PATH: $PATH"
        find /mingw64/bin -name "qmake*"
        
        # 3. 验证并执行
        qmake -v
        
        mkdir -p build
        cd build
        # 使用全路径执行 qmake 确保万无一失
        /mingw64/bin/qmake ../SerialPortConnector.pro CONFIG+=release
        /mingw64/bin/mingw32-make -j$(nproc)

    # =========================
    # 3. Deploy (关键)
    # =========================
    - name: Deploy Qt runtime
      run: |
        set -e

        mkdir -p deploy

        # 找 exe（避免 release/debug 不确定）
        EXE=$(find build -name "*.exe" | head -n 1)

        echo "Found exe: $EXE"

        cp "$EXE" deploy/

        export PATH=/mingw64/bin:$PATH
        export QT_PLUGIN_PATH=/mingw64/share/qt5/plugins

        windeployqt.exe --release deploy/*.exe

    # =========================
    # 4. Package
    # =========================
    - name: Package
      run: |
        set -e
        cd deploy
        zip -r ../SerialPortConnector-Windows.zip .

    # =========================
    # 5. Upload artifact
    # =========================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SerialPortConnector-Windows
        path: SerialPortConnector-Windows.zip

    # =========================
    # 6. Create GitHub Release
    # =========================
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: SerialPortConnector-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
